name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read # dependabot/fetch-metadata reads the PR to classify it

    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable —
      # whoever controls the action can retag it, and this workflow ends in a
      # job with contents: write that merges without a human. That is the
      # tj-actions/changed-files attack shape. Dependabot's github-actions
      # ecosystem keeps these SHAs (and the version comments) current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Matches the Vercel build. A dependency bump that drifts the lockfile
      # fails here instead of on a production deploy.
      - run: pnpm install --frozen-lockfile

      # Classify Dependabot PRs so the audit gate below can tell a PR that will
      # auto-merge unattended from one that waits for a human. Same action and
      # SHA the merge job uses, so both decisions read the same source.
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The wide net, advisory for everyone. test/security-overrides.test.ts
      # hard-fails if one of the two known pins regresses; this surfaces a NEW
      # advisory anywhere in the tree of ~830 packages.
      #
      # Never a gate: an upstream advisory with no published fix would turn
      # every unrelated PR red on something its author cannot fix, and gates
      # that block work people can't do are the ones that get deleted.
      - run: pnpm audit
        continue-on-error: true

      # The gates. These block, but only where "read it on the PR" is a lie.
      #
      # dependabot-auto-merge below squash-merges on `needs: verify` with no
      # human in the loop, so for those PRs a non-blocking audit is not a weak
      # control — it is no control. A security PR that leaves the tree
      # vulnerable would merge itself. Red verify -> `needs: verify` unsatisfied
      # -> no auto-merge -> the PR waits for a human. That is the whole gate.
      #
      # Two things keep it from becoming the blunt instrument that would undo
      # the rest of this workflow's design:
      #
      #   --prod / --dev  scopes each gate to the dependency class its PR can
      #                   actually fix. dependabot.yml splits security updates
      #                   into production and development groups precisely so a
      #                   stuck dev advisory cannot hold back a production
      #                   security patch (PR #30 did exactly that for two
      #                   months). An unqualified `pnpm audit` here would
      #                   re-couple them and reintroduce that bug.
      #
      #   dependency-group  matches only the auto-merged security groups.
      #                   Routine version-update PRs are not auto-merged, so
      #                   they get the advisory step above and nothing more.
      #
      #   update-type     matches only patch/minor, mirroring the merge step's
      #                   condition exactly. The invariant is "gate precisely
      #                   the set that merges unattended" — nothing wider. A
      #                   MAJOR security PR is not auto-merged; it gets the
      #                   needs-review label and a comment from the job below.
      #                   Gating it would redden verify, `needs: verify` would
      #                   go unsatisfied, that job would never run, and the
      #                   label and comment would never fire. The PR would sit
      #                   red with no explanation of what a human should do.
      #
      # --ignore-unfixable keeps an advisory with no published resolution from
      # deadlocking security automation on work nobody can do.
      #
      # Keep these two `if` conditions in sync with the merge step's condition
      # below. test/typescript-toolchain.test.ts asserts they agree.
      - name: Audit gate — production security PRs merge unattended
        if: |
          steps.metadata.outputs.dependency-group == 'security-production' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: pnpm audit --prod --ignore-unfixable

      - name: Audit gate — development security PRs merge unattended
        if: |
          steps.metadata.outputs.dependency-group == 'security-development' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: pnpm audit --dev --ignore-unfixable

      # Non-blocking: main already has 12 react-hooks/react-compiler errors
      # predating this workflow. Flip to blocking once those are cleared —
      # until then a red lint would permanently block Dependabot auto-merge.
      - run: pnpm run lint
        continue-on-error: true

      # Explicitly the TypeScript 6 compiler. `typescript7` is installed
      # alongside as an alias and wins the node_modules/.bin/tsc name, so a
      # bare `tsc` here would silently switch compilers.
      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

  # Security advisories used to sit for months because nobody merged the PR,
  # and Dependabot keeps only one open PR per group — so one stale PR blocked
  # every later advisory. This lands security patches on green CI, unattended.
  #
  # `needs: verify` is what makes this safe: the merge runs in the same
  # workflow run, after the checks above pass. It does not rely on branch
  # protection being configured.
  #
  # Scope is deliberately narrow: security-update groups only, patch/minor
  # only. Majors and routine version bumps still wait for a human.
  dependabot-auto-merge:
    name: Auto-merge Dependabot security patches
    needs: verify
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write # gh label create / --add-label go through the Issues API

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # dependency-group comes from the group names in .github/dependabot.yml.
      - name: Approve and merge
        if: |
          startsWith(steps.metadata.outputs.dependency-group, 'security-') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        # --match-head-commit closes a real race: Dependabot force-pushes
        # rebases onto its own branches, so without it `verify` can go green
        # on SHA A while the squash lands SHA B. That would merge untested
        # code and defeat the whole point of `needs: verify`. If the head
        # moved mid-run, this fails loudly and the rebase gets its own run.
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A major security bump can break things CI won't catch. Flag it loudly
      # instead of merging it.
      - name: Flag major security updates for review
        if: |
          startsWith(steps.metadata.outputs.dependency-group, 'security-') &&
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          # Create if missing; never clobber an existing label's color.
          gh label create "needs-review" --color d93f0b \
            --description "Needs a human before merge" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label "needs-review"
          gh pr comment "$PR_URL" --body \
            "Major-version security update — not auto-merged. Review and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
