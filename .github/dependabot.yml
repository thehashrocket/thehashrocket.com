# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# NOTE: this repo uses pnpm, but the ecosystem value is still "npm".
# GitHub has no "pnpm" ecosystem — npm/yarn/pnpm all use "npm", and Dependabot
# picks the package manager from the lockfile present (pnpm-lock.yaml here).
# An invalid value makes the whole file fail to parse, which silently disables
# version updates.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Security updates are split production/development so that one stuck
      # devDependency PR can't hold back a production security patch.
      # Dependabot keeps only one open PR per group at a time — that is how
      # PR #30 (vitest) blocked every later advisory for two months.
      security-production:
        applies-to: security-updates
        dependency-type: "production"
        patterns:
          - "*"
      security-development:
        applies-to: security-updates
        dependency-type: "development"
        patterns:
          - "*"

      # Routine upkeep batches into two PRs instead of ~15. Majors stay
      # ungrouped so they arrive as individual, reviewable PRs.
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      development-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Keep the CI workflow actions patched too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Same security- prefix the auto-merge job matches on. Without this,
      # an Actions advisory arrives ungrouped, dependency-group is empty,
      # and it silently never auto-merges.
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"
